<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LiveNovaのクロージングスクリプトを分岐ごとに確認できるフローチャート">
  <link rel="icon" href="data:,">
  <title>LiveNova クロージング・フローナビ</title>
  <style>
    :root {
      --ink: #112a46;
      --muted: #65758a;
      --line: #d8e2ec;
      --paper: #fff;
      --canvas: #f4f7fb;
      --navy: #0d335d;
      --blue: #2477b5;
      --blue-soft: #eaf4fb;
      --green: #258162;
      --green-soft: #eaf7f1;
      --purple: #6a58ad;
      --purple-soft: #f1eefb;
      --amber: #a96800;
      --amber-soft: #fff5de;
      --red: #a62d39;
      --red-soft: #fff0f2;
      --teal: #167e86;
      --teal-soft: #e9f7f7;
      --shadow: 0 15px 38px rgb(21 51 82 / 9%);
      --font: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: var(--font); font-size: 16px; line-height: 1.7; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 72px;
      padding: 12px clamp(18px, 3vw, 44px);
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / 94%);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; color: #fff; background: var(--navy); font-weight: 900; }
    .brand p { margin: 0; color: var(--blue); font-size: .75rem; font-weight: 800; letter-spacing: .12em; }
    .brand h1 { margin: 0; font-size: 1.15rem; line-height: 1.35; letter-spacing: -.02em; }
    .source-link { padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; color: #35516d; background: #fff; font-size: .85rem; font-weight: 700; text-decoration: none; }
    .source-link:hover { background: #eef4f8; }

    .notice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px clamp(18px, 3vw, 44px);
      border-bottom: 1px solid #ead39d;
      color: #71530c;
      background: #fff8df;
      font-size: .85rem;
    }
    .notice strong { white-space: nowrap; }

    .session-bar {
      display: flex;
      align-items: end;
      gap: 14px;
      padding: 14px clamp(18px, 3vw, 44px);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .session-field { display: grid; flex: 1 1 220px; gap: 5px; max-width: 320px; }
    .session-field span { color: #53677d; font-size: .74rem; font-weight: 850; letter-spacing: .04em; }
    .session-field input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #b9c8d6;
      border-radius: 9px;
      color: var(--ink);
      background: #fbfdff;
      font: inherit;
    }
    .session-field input:focus, .memo-editor textarea:focus, .export-textarea:focus {
      outline: 3px solid rgb(36 119 181 / 18%);
      border-color: var(--blue);
    }
    .session-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .memo-count { color: var(--muted); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .export-button, .dialog-button {
      padding: 9px 13px;
      border: 1px solid var(--navy);
      border-radius: 9px;
      color: #fff;
      background: var(--navy);
      font-size: .84rem;
      font-weight: 850;
    }
    .export-button:hover, .dialog-button:hover { background: #174a79; }
    .dialog-button.secondary { color: #35516d; background: #fff; border-color: #aebdcc; }
    .dialog-button.secondary:hover { background: #eef4f8; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(360px, .75fr);
      align-items: start;
      gap: 24px;
      max-width: 1560px;
      margin: 0 auto;
      padding: 28px clamp(18px, 3vw, 44px) 64px;
    }

    .flow-shell, .detail-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .flow-shell { padding: clamp(18px, 2.4vw, 30px); }
    .section-kicker { margin: 0; color: var(--blue); font-size: .75rem; font-weight: 850; letter-spacing: .13em; }
    .flow-heading { margin: 3px 0 5px; font-size: clamp(1.45rem, 2vw, 2rem); line-height: 1.35; letter-spacing: -.035em; }
    .flow-intro { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }

    .flow-map { display: flex; flex-direction: column; align-items: stretch; }
    .flow-stage { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfe; }
    .flow-stage-label { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; color: #53677d; font-size: .8rem; font-weight: 800; list-style: none; cursor: pointer; }
    .flow-stage-label::-webkit-details-marker { display: none; }
    .flow-stage-label > .stage-number { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; color: #fff; background: var(--navy); font-size: .72rem; }
    .stage-chevron { display: none; margin-left: auto; color: #75869a; font-size: 1.2rem; line-height: 1; transition: transform .2s ease; }
    .flow-stage[open] .stage-chevron { transform: rotate(90deg); }
    .flow-row { display: flex; align-items: stretch; gap: 10px; }
    .flow-row .chart-node { flex: 1 1 0; }
    .row-arrow { display: grid; flex: 0 0 24px; place-items: center; color: #8c9bab; font-size: 1.25rem; font-weight: 900; }
    .stage-arrow { display: grid; height: 36px; place-items: center; color: #718398; font-size: 1.45rem; font-weight: 900; }

    .chart-node {
      min-width: 0;
      min-height: 78px;
      padding: 13px 14px;
      border: 1px solid var(--node);
      border-left-width: 4px;
      border-radius: 11px;
      color: var(--ink);
      text-align: left;
      background: var(--node-soft);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .chart-node:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgb(26 59 92 / 12%); }
    .chart-node:focus-visible { outline: 3px solid rgb(36 119 181 / 28%); outline-offset: 2px; }
    .chart-node[aria-pressed="true"] { color: #fff; background: var(--node); box-shadow: 0 8px 20px rgb(24 55 88 / 18%); }
    .chart-node small { display: block; margin-bottom: 3px; color: var(--node); font-size: .7rem; font-weight: 900; letter-spacing: .09em; }
    .chart-node[aria-pressed="true"] small { color: #fff; }
    .chart-node strong { display: block; font-size: .93rem; line-height: 1.45; }
    .chart-node.has-memo { box-shadow: inset 0 0 0 2px rgb(255 255 255 / 75%), 0 0 0 2px var(--node); }
    .memo-badge { display: inline-block; margin-top: 7px; padding: 2px 7px; border-radius: 99px; color: #fff; background: var(--node); font-size: .66rem; font-weight: 850; }
    .chart-node[aria-pressed="true"] .memo-badge { color: var(--node); background: #fff; }
    .tone-blue { --node: var(--blue); --node-soft: var(--blue-soft); }
    .tone-green { --node: var(--green); --node-soft: var(--green-soft); }
    .tone-purple { --node: var(--purple); --node-soft: var(--purple-soft); }
    .tone-amber { --node: var(--amber); --node-soft: var(--amber-soft); }
    .tone-red { --node: var(--red); --node-soft: var(--red-soft); }
    .tone-teal { --node: var(--teal); --node-soft: var(--teal-soft); }

    .decision-main { display: grid; width: min(280px, 100%); min-height: 92px; place-content: center; margin: 0 auto 18px; padding: 18px 42px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); color: #fff; text-align: center; background: var(--navy); border: 0; }
    .decision-main small { color: #b9d7ed; }
    .decision-main[aria-pressed="true"] { background: var(--blue); }
    .branches { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 13px; }
    .branch { position: relative; padding: 13px; border-top: 2px solid #b8c6d3; background: #fff; }
    .branch-label { display: block; margin-bottom: 8px; color: #607187; font-size: .75rem; font-weight: 850; text-align: center; }
    .branch .chart-node { width: 100%; }
    .branch .chart-node + .chart-node { margin-top: 8px; }
    .merge-cue { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; color: #6c7d90; font-size: .77rem; font-weight: 800; text-align: center; }
    .merge-cue::before, .merge-cue::after { content: ""; width: 34px; border-top: 1px solid #b4c0cd; }

    .detail-panel {
      position: sticky;
      top: 96px;
      overflow: hidden;
      padding: 12px;
      background: rgb(255 255 255 / 86%);
    }
    .detail-head {
      padding: 20px 20px 21px;
      border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, #0d335d 0%, #164b7c 100%);
      box-shadow: 0 10px 24px rgb(13 51 93 / 18%);
    }
    .detail-head p { margin: 0; color: #c3deef; font-size: .74rem; font-weight: 850; letter-spacing: .1em; }
    .detail-head > p:first-of-type { display: inline-flex; align-items: center; min-height: 25px; padding: 3px 8px; border: 1px solid rgb(255 255 255 / 18%); border-radius: 99px; background: rgb(255 255 255 / 10%); }
    .detail-head h2 { margin: 9px 0 7px; font-size: 1.35rem; line-height: 1.35; letter-spacing: -.025em; overflow-wrap: anywhere; text-wrap: balance; }
    .detail-head .summary { margin: 0; color: #e8f2f8; font-size: .86rem; line-height: 1.6; letter-spacing: 0; }
    .detail-body { max-height: calc(100vh - 272px); overflow-y: auto; padding: 19px 8px 10px; }
    .detail-block + .detail-block { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e5ebf1; }
    .detail-block h3 { margin: 0 0 9px; color: #445970; font-size: .78rem; letter-spacing: .06em; }
    .script-list, .point-list, .warning-list { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .script-list li { padding: 12px 14px; border-left: 4px solid var(--blue); border-radius: 0 9px 9px 0; color: #24415f; background: var(--blue-soft); font-size: .9rem; }
    .point-list li, .warning-list li { position: relative; padding-left: 18px; color: #42566d; font-size: .88rem; }
    .point-list li::before, .warning-list li::before { content: ""; position: absolute; top: .72em; left: 2px; width: 6px; height: 6px; border-radius: 99px; background: var(--green); }
    .warning-box { padding: 13px 14px; border: 1px solid #efbec4; border-radius: 10px; background: var(--red-soft); }
    .warning-box h3 { color: var(--red); }
    .warning-list li::before { background: var(--red); }
    .next-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .next-button { padding: 8px 11px; border: 1px solid #9ebbd0; border-radius: 8px; color: #245e87; background: #f4f9fc; font-size: .8rem; font-weight: 800; }
    .next-button:hover { background: #e6f2f9; }
    .detail-empty { padding: 32px 24px; color: var(--muted); }
    .copy-card-list { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 10px; }
    .copy-card {
      position: relative;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      width: 100%;
      padding: 13px 82px 13px 14px;
      border: 1px solid #bdd1df;
      border-radius: 11px;
      color: #24415f;
      text-align: left;
      background: #f5fafe;
      transition: border-color .16s ease, transform .16s ease, background .16s ease;
    }
    .copy-card:hover { transform: translateY(-1px); border-color: var(--blue); background: var(--blue-soft); }
    .copy-card:focus-visible { outline: 3px solid rgb(36 119 181 / 22%); outline-offset: 2px; }
    .copy-card strong { display: block; min-width: 0; font-size: .9rem; line-height: 1.45; overflow-wrap: anywhere; }
    .copy-card-preview { display: block; overflow: hidden; margin-top: 4px; color: #60758a; font-size: .76rem; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
    .copy-card-action { position: absolute; top: 50%; right: 12px; padding: 4px 8px; border-radius: 99px; color: #fff; background: var(--blue); font-size: .68rem; font-weight: 850; transform: translateY(-50%); }
    .copy-card.copied { border-color: var(--green); background: var(--green-soft); }
    .copy-card.copied .copy-card-action { background: var(--green); }
    .copy-preview-popover {
      position: fixed;
      z-index: 120;
      width: min(380px, calc(100vw - 24px));
      max-height: min(420px, calc(100dvh - 24px));
      overflow: auto;
      padding: 13px 14px 14px;
      border: 1px solid rgb(174 198 215 / 82%);
      border-radius: 15px;
      color: #24415f;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 18px 48px rgb(13 51 93 / 20%), 0 3px 10px rgb(13 51 93 / 9%);
      backdrop-filter: blur(18px) saturate(150%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(6px) scale(.985);
      transform-origin: var(--preview-origin-x, 50%) var(--preview-origin-y, 100%);
      transition: opacity .14s ease-out, transform .18s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .18s;
    }
    .copy-preview-popover.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }
    .copy-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 9px; border-bottom: 1px solid #e2eaf0; }
    .copy-preview-head strong { min-width: 0; font-size: .86rem; line-height: 1.45; overflow-wrap: anywhere; }
    .copy-preview-head span { flex: 0 0 auto; color: var(--blue); font-size: .67rem; font-weight: 850; }
    .copy-preview-text { margin: 10px 0 0; color: #40576e; font: inherit; font-size: .8rem; line-height: 1.68; white-space: pre-wrap; overflow-wrap: anywhere; }
    .copy-feedback { min-height: 1.4em; margin: 8px 0 0; color: var(--green); font-size: .76rem; font-weight: 800; }
    .copy-data-panel { margin-top: 12px; padding: 13px 14px; border: 1px solid #d8e2ea; border-radius: 12px; background: #f8fafc; }
    .copy-data-panel > strong { display: block; color: #334e68; font-size: .82rem; }
    .copy-data-note { margin: 4px 0 10px; color: var(--muted); font-size: .73rem; line-height: 1.55; }
    .copy-data-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .copy-data-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 11px;
      border: 1px solid #a9becd;
      border-radius: 9px;
      color: #285979;
      background: #fff;
      font: inherit;
      font-size: .76rem;
      font-weight: 800;
      text-decoration: none;
    }
    .copy-data-button:hover { border-color: var(--blue); background: var(--blue-soft); }
    .copy-data-button.primary { color: #fff; border-color: var(--navy); background: var(--navy); }
    .copy-data-button.primary:hover { background: #174f7d; }
    .copy-data-status { min-height: 1.4em; margin: 8px 0 0; color: var(--green); font-size: .73rem; font-weight: 800; }
    .copy-data-input { display: none; }
    .memo-editor textarea {
      display: block;
      width: 100%;
      min-height: 138px;
      resize: vertical;
      padding: 12px 13px;
      border: 1px solid #b9c8d6;
      border-radius: 10px;
      color: var(--ink);
      background: #fffdf7;
      font: inherit;
      font-size: .9rem;
      line-height: 1.65;
    }
    .save-hint { margin: 6px 0 0; color: var(--muted); font-size: .73rem; }

    .export-dialog {
      width: min(720px, calc(100vw - 32px));
      max-height: calc(100vh - 40px);
      padding: 0;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 24px 70px rgb(13 51 93 / 24%);
    }
    .export-dialog::backdrop { background: rgb(10 29 49 / 52%); backdrop-filter: blur(3px); }
    .dialog-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 1.2rem; }
    .dialog-head p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
    .dialog-body { padding: 18px 22px 22px; }
    .export-textarea { width: 100%; min-height: 360px; resize: vertical; padding: 13px; border: 1px solid #b9c8d6; border-radius: 10px; color: #203c58; background: #f8fafc; font: 13px/1.65 ui-monospace, "Cascadia Code", monospace; }
    .dialog-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 12px; }
    .copy-status { margin-left: auto; color: var(--green); font-size: .8rem; font-weight: 800; }
    .mobile-back, .mobile-tabbar { display: none; }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
      .detail-body { max-height: none; }
    }
    @media (max-width: 760px) {
      :root { font-size: 16px; }
      body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); background: #f2f2f7; -webkit-tap-highlight-color: transparent; }
      button, a, input, textarea { touch-action: manipulation; }

      .topbar {
        min-height: 56px;
        padding: 8px 14px;
        gap: 10px;
        border-bottom-color: rgb(216 226 236 / 65%);
        background: rgb(255 255 255 / 78%);
        backdrop-filter: blur(20px) saturate(180%);
      }
      .brand { min-width: 0; gap: 9px; }
      .brand-mark { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px; font-size: .86rem; }
      .brand p { display: none; }
      .brand h1 { overflow: hidden; font-size: .98rem; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
      .source-link { flex: 0 0 auto; padding: 6px 9px; border-radius: 8px; font-size: .7rem; }

      .notice {
        align-items: flex-start;
        margin: 10px 12px 0;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        font-size: .73rem;
        line-height: 1.5;
      }
      .notice strong { padding-top: 1px; }

      .session-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        margin: 10px 12px 0;
        padding: 12px;
        border: 0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(25 48 72 / 4%);
      }
      .session-field { min-width: 0; max-width: none; gap: 4px; }
      .session-field span { font-size: .69rem; }
      .session-field input { min-height: 44px; padding: 9px 10px; border-color: #d2dae3; border-radius: 10px; font-size: .9rem; background: #f7f8fa; }
      .session-actions { grid-column: 1 / -1; justify-content: space-between; width: 100%; margin: 0; }
      .export-button { min-height: 44px; padding-inline: 16px; border: 0; border-radius: 11px; }

      .workspace { display: block; padding: 12px; }
      .flow-shell, .detail-panel { border: 0; border-radius: 20px; box-shadow: 0 1px 2px rgb(25 48 72 / 4%), 0 10px 32px rgb(25 48 72 / 6%); scroll-margin-top: 68px; }
      .flow-shell { padding: 16px 14px 18px; }
      .section-kicker { font-size: .66rem; letter-spacing: .1em; }
      .flow-heading { margin-top: 2px; font-size: 1.35rem; line-height: 1.22; letter-spacing: -.025em; }
      .flow-intro { margin-bottom: 16px; font-size: .8rem; line-height: 1.55; }

      body[data-mobile-view="detail"] .flow-shell { display: none; }
      body[data-mobile-view="flow"] .detail-panel { display: none; }

      .flow-map { gap: 8px; }
      .flow-stage { padding: 0; overflow: hidden; border-color: #e1e6ec; border-radius: 14px; background: #fff; }
      .flow-stage-label { min-height: 54px; margin: 0; padding: 10px 12px; font-size: .82rem; line-height: 1.3; }
      .flow-stage-label > .stage-number { width: 30px; height: 30px; border-radius: 9px; }
      .stage-chevron { display: block; }
      .flow-stage-content { padding: 4px 10px 12px; }
      .stage-arrow { display: none; }
      .flow-row { flex-direction: column; gap: 6px; }
      .row-arrow { height: 18px; flex-basis: 18px; font-size: 0; }
      .row-arrow::after { content: "↓"; color: #9aa8b6; font-size: 1rem; }
      .branches { grid-template-columns: 1fr; gap: 8px; }
      .branch { padding: 8px 0 0; border-top-color: #d9e1e9; }
      .branch-label { margin-bottom: 6px; font-size: .7rem; }
      .decision-main { width: min(250px, 88%); min-height: 82px; margin-bottom: 12px; padding: 16px 38px; }
      .chart-node { min-height: 64px; padding: 11px 12px; border-radius: 12px; }
      .chart-node strong { font-size: .88rem; }
      .chart-node:active, .copy-card:active, .next-button:active, .export-button:active, .mobile-back:active { transform: scale(.975); transition-duration: .08s; }

      .detail-panel { position: static; overflow: visible; padding: 10px; background: rgb(255 255 255 / 88%); }
      .detail-head { position: relative; padding: 13px 15px 17px; border-radius: 16px; }
      .detail-head h2 { margin-top: 8px; font-size: 1.24rem; line-height: 1.38; }
      .detail-head .summary { font-size: .82rem; line-height: 1.55; }
      .mobile-back { display: inline-flex; align-items: center; min-height: 36px; margin: -4px 0 7px -6px; padding: 4px 8px; border: 0; border-radius: 9px; color: #d9ecf8; background: transparent; font-size: .78rem; font-weight: 800; }
      .detail-body { max-height: none; padding: 16px 5px 10px; }
      .detail-block + .detail-block { margin-top: 16px; padding-top: 15px; }

    function parseCsvRows(csvText) {
      const source = String(csvText).replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let index = 0; index < source.length; index += 1) {
        const character = source[index];
        if (quoted) {
          if (character === '"' && source[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else if (character === '"') {
            quoted = false;
          } else {
            cell += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(cell);
          cell = "";
        } else if (character === "\n" || character === "\r") {
          if (character === "\r" && source[index + 1] === "\n") index += 1;
          row.push(cell);
          if (row.some(function (value) { return value !== ""; })) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += character;
        }
      }
      if (quoted) throw new Error("引用符が閉じられていません");
      row.push(cell);
      if (row.some(function (value) { return value !== ""; })) rows.push(row);
      return rows;
    }

    function parseCopyItemsCsv(csvText) {
      const rows = parseCsvRows(csvText);
      if (rows.length < 2) throw new Error("コピー項目がありません");
      const headers = rows[0].map(function (header) { return header.trim().toLowerCase(); });
      const columnIndex = function (names) {
        return headers.findIndex(function (header) { return names.includes(header); });
      };
      const orderIndex = columnIndex(["並び順", "order"]);
      const idIndex = columnIndex(["id", "項目id"]);
      const titleIndex = columnIndex(["表示名", "title"]);
      const textIndex = columnIndex(["コピー本文", "text"]);
      if (titleIndex < 0 || textIndex < 0) throw new Error("「表示名」と「コピー本文」の列が必要です");

      const items = rows.slice(1).map(function (columns, index) {
        const order = orderIndex >= 0 ? Number(columns[orderIndex]) : index + 1;
        return {
          order: Number.isFinite(order) ? order : index + 1,
          id: (idIndex >= 0 && columns[idIndex] ? columns[idIndex].trim() : "copy-item-" + (index + 1)),
          title: String(columns[titleIndex] || "").trim(),
          text: String(columns[textIndex] || "").replaceAll("\\n", "\n").trim()
        };
      }).filter(function (item) {
        return item.title && item.text;
      }).sort(function (left, right) {
        return left.order - right.order;
      });

      if (!items.length) throw new Error("有効なコピー項目がありません");
      return items.map(function (item) {
        return { id: item.id, title: item.title, text: item.text };
      });
    }

    function applyCopyItems(items) {
      DATA.nodes.prestream.copyItems = items.map(function (item, index) {
        return {
          id: item.id || "copy-item-" + (index + 1),
          title: String(item.title || ""),
          text: String(item.text || "")
        };
      });
    }

    function copyItemsMatch(left, right) {
      return Boolean(left && right) &&
        String(left.id || "") === String(right.id || "") &&
        String(left.title || "") === String(right.title || "") &&
        String(left.text || "") === String(right.text || "");
    }

    function mergePublishedCopyItems(publishedItems, localItems, publishedBase) {
      const localById = new Map(localItems.map(function (item) { return [item.id, item]; }));
      const baseItems = Array.isArray(publishedBase) ? publishedBase : [];
      const baseById = new Map(baseItems.map(function (item) { return [item.id, item]; }));
      const publishedIds = new Set(publishedItems.map(function (item) { return item.id; }));
      const hasPublishedBase = Array.isArray(publishedBase);
      const merged = [];

      publishedItems.forEach(function (publishedItem) {
        const localItem = localById.get(publishedItem.id);
        const baseItem = baseById.get(publishedItem.id);

        if (!localItem) {
          if (!(hasPublishedBase && baseItem)) merged.push(publishedItem);
          return;
        }

        merged.push(baseItem && copyItemsMatch(localItem, baseItem) ? publishedItem : localItem);
      });

      localItems.forEach(function (localItem) {
        if (publishedIds.has(localItem.id)) return;
        const baseItem = baseById.get(localItem.id);
        if (!baseItem || !copyItemsMatch(localItem, baseItem)) merged.push(localItem);
      });

      return merged;
    }

    async function loadPublishedCopyItems(force) {
      try {
        const response = await fetch("copy-items.csv", { cache: "no-store" });

        const publishedItems = parseCopyItemsCsv(await response.text());
        latestPublishedCopyItems = publishedItems;

        if (sessionState.copyItemsOverride && !force) {
          const mergedItems = mergePublishedCopyItems(
            publishedItems,
            sessionState.copyItemsOverride,
            sessionState.copyItemsPublishedBase
          );
          sessionState.copyItemsOverride = mergedItems;
          sessionState.copyItemsPublishedBase = publishedItems;
          saveSession();
          applyCopyItems(mergedItems);
        } else {
          applyCopyItems(publishedItems);
        }
        if (activeNodeId === "prestream") selectNode("prestream", false);
      } catch (error) {
        applyCopyItems(sessionState.copyItemsOverride || defaultCopyItems);
        if (activeNodeId === "prestream") selectNode("prestream", false);
      }
    }

    }

    async function writeClipboardText(value) {
      try {
        await navigator.clipboard.writeText(value);
        return true;
      } catch (error) {
        const helper = document.createElement("textarea");
        helper.value = value;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        return copied;
      }
    }

    async function copyCardText(button) {
      const node = DATA.nodes[activeNodeId];
      const item = node && node.copyItems ? node.copyItems[Number(button.dataset.copyIndex)] : null;
      if (!item) return;
      const copied = await writeClipboardText(personalize(item.text));
      const feedback = document.getElementById("copyCardFeedback");
      document.querySelectorAll(".copy-card").forEach(function (card) {
        card.classList.remove("copied");
        const action = card.querySelector(".copy-card-action");
        if (action) action.textContent = "コピー";
      });
      if (copied) {
        button.classList.add("copied");
        button.querySelector(".copy-card-action").textContent = "コピー済み";
        if (feedback) feedback.textContent = "「" + item.title + "」をコピーしました。";
      } else if (feedback) {
        feedback.textContent = "コピーできませんでした。ブラウザのクリップボード設定をご確認ください。";
      }
    }

    function copyItemForButton(button) {
      const node = DATA.nodes[activeNodeId];
      return node && node.copyItems ? node.copyItems[Number(button.dataset.copyIndex)] : null;
    }

    function positionCopyPreview() {
      copyPreviewFrame = 0;
      const popover = document.getElementById("copyPreviewPopover");
      const button = copyPreviewAnchor;
      if (!popover || !button || !button.isConnected || !hoverPreviewMedia.matches) {
        hideCopyPreview();
        return;
      }

      const gap = 10;
      const edge = 12;
      const anchorRect = button.getBoundingClientRect();
      const previewRect = popover.getBoundingClientRect();
      const fitsRight = window.innerWidth - anchorRect.right - gap - edge >= previewRect.width;
      const fitsLeft = anchorRect.left - gap - edge >= previewRect.width;
      let left;
      let top;
      let originX = "50%";
      let originY = "100%";

      if (fitsRight || fitsLeft) {
        const placeRight = fitsRight && (!fitsLeft || window.innerWidth - anchorRect.right >= anchorRect.left);
        left = placeRight ? anchorRect.right + gap : anchorRect.left - previewRect.width - gap;
        top = Math.min(Math.max(anchorRect.top, edge), window.innerHeight - previewRect.height - edge);
        originX = placeRight ? "0%" : "100%";
        originY = Math.round(Math.min(Math.max(anchorRect.top + anchorRect.height / 2 - top, 16), previewRect.height - 16)) + "px";
      } else {
        const roomBelow = window.innerHeight - anchorRect.bottom - gap - edge;
        const roomAbove = anchorRect.top - gap - edge;
        const placeBelow = roomBelow >= previewRect.height || roomBelow >= roomAbove;
        left = anchorRect.left + anchorRect.width / 2 - previewRect.width / 2;
        left = Math.min(Math.max(left, edge), window.innerWidth - previewRect.width - edge);
        top = placeBelow ? anchorRect.bottom + gap : anchorRect.top - previewRect.height - gap;
        top = Math.min(Math.max(top, edge), window.innerHeight - previewRect.height - edge);
        originX = Math.round(Math.min(Math.max(anchorRect.left + anchorRect.width / 2 - left, 16), previewRect.width - 16)) + "px";
        originY = placeBelow ? "0%" : "100%";
      }

      popover.style.left = Math.round(left) + "px";
      popover.style.top = Math.round(top) + "px";
      popover.style.setProperty("--preview-origin-x", originX);
      popover.style.setProperty("--preview-origin-y", originY);
    }

    function showCopyPreview(button) {
      if (!hoverPreviewMedia.matches) return;
      const item = copyItemForButton(button);
      const popover = document.getElementById("copyPreviewPopover");
      if (!item || !popover) return;
      if (copyPreviewHideTimer) clearTimeout(copyPreviewHideTimer);
      copyPreviewHideTimer = 0;
      if (copyPreviewAnchor && copyPreviewAnchor !== button) copyPreviewAnchor.removeAttribute("aria-describedby");
      copyPreviewAnchor = button;
      document.getElementById("copyPreviewTitle").textContent = item.title;
      document.getElementById("copyPreviewText").textContent = personalize(item.text);
      button.setAttribute("aria-describedby", "copyPreviewPopover");
      popover.setAttribute("aria-hidden", "false");
      positionCopyPreview();
      popover.classList.add("is-visible");
    }

    function hideCopyPreview(button) {
      if (button && copyPreviewAnchor !== button) return;
      const popover = document.getElementById("copyPreviewPopover");
      if (copyPreviewHideTimer) clearTimeout(copyPreviewHideTimer);
      copyPreviewHideTimer = 0;
      if (copyPreviewAnchor) copyPreviewAnchor.removeAttribute("aria-describedby");
      copyPreviewAnchor = null;
      if (copyPreviewFrame) cancelAnimationFrame(copyPreviewFrame);
      copyPreviewFrame = 0;
      if (popover) {
        popover.classList.remove("is-visible");
        popover.setAttribute("aria-hidden", "true");
      }
    }

    function queueCopyPreviewHide(button) {
      if (copyPreviewHideTimer) clearTimeout(copyPreviewHideTimer);
      copyPreviewHideTimer = setTimeout(function () { hideCopyPreview(button); }, 120);
    }

    function scheduleCopyPreviewPosition() {
      if (!copyPreviewAnchor || copyPreviewFrame) return;
      copyPreviewFrame = requestAnimationFrame(positionCopyPreview);
    }

    async function copyExportText() {
      const textarea = document.getElementById("exportTextarea");
      const status = document.getElementById("copyStatus");
      const copied = await writeClipboardText(textarea.value);
      status.textContent = copied ? "コピーしました" : "選択した内容をコピーしてください";
    }

    function downloadExportText() {
      const text = document.getElementById("exportTextarea").value;
      const safeName = (sessionState.candidateName.trim() || "未入力")
        .replace(/[\\/:*?"<>|]/g, "_")
        .slice(0, 40);
      const date = new Date();
      const datePart = [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
      const url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "面談メモ_" + safeName + "_" + datePart + ".md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    document.addEventListener("click", function (event) {
      const importCsvButton = event.target.closest("[data-import-copy-csv]");
      if (importCsvButton) {
        const input = document.getElementById("copyCsvInput");
        if (input) input.click();
        return;
      }
      const resetCsvButton = event.target.closest("[data-reset-copy-csv]");
      if (resetCsvButton) {
        resetCopyItemsCsv();
        return;
      }
      const mobileBack = event.target.closest("[data-mobile-back]");
      if (mobileBack) {
        setMobileView("flow", true);
        return;
      }
      const mobileViewButton = event.target.closest("[data-mobile-view-target]");
      if (mobileViewButton) {
        setMobileView(mobileViewButton.dataset.mobileViewTarget, true);
        return;
      }
      const copyButton = event.target.closest("[data-copy-index]");
      if (copyButton) {
        copyCardText(copyButton);
        return;
      }
      const button = event.target.closest("[data-node]");
      if (!button) return;
      selectNode(button.dataset.node, true);
    });

    document.addEventListener("input", function (event) {
      if (event.target.id === "nodeMemo") {
        sessionState.notes[event.target.dataset.noteId] = event.target.value;
        saveSession();
        updateMemoIndicators();
      }
    });

    document.addEventListener("change", function (event) {
      if (event.target.id === "copyCsvInput") importCopyItemsCsv(event.target);
    });

    document.addEventListener("pointerover", function (event) {
      const button = event.target.closest(".copy-card");
      if (!button || (event.relatedTarget && button.contains(event.relatedTarget))) return;
      showCopyPreview(button);
    });

    document.addEventListener("pointerout", function (event) {
      const button = event.target.closest(".copy-card");
      if (!button || (event.relatedTarget && button.contains(event.relatedTarget))) return;
      queueCopyPreviewHide(button);
    });

    document.addEventListener("focusin", function (event) {
      const button = event.target.closest(".copy-card");
      if (button) showCopyPreview(button);
    });

    document.addEventListener("focusout", function (event) {
      const button = event.target.closest(".copy-card");
      if (button) hideCopyPreview(button);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") hideCopyPreview();
    });

    document.getElementById("copyPreviewPopover").addEventListener("pointerenter", function () {
      if (copyPreviewHideTimer) clearTimeout(copyPreviewHideTimer);
      copyPreviewHideTimer = 0;
    });
    document.getElementById("copyPreviewPopover").addEventListener("pointerleave", function () {
      queueCopyPreviewHide(copyPreviewAnchor);
    });
    document.getElementById("copyPreviewPopover").addEventListener("click", function () {
      if (copyPreviewAnchor) copyCardText(copyPreviewAnchor);
    });

    document.addEventListener("scroll", scheduleCopyPreviewPosition, true);
    window.addEventListener("resize", scheduleCopyPreviewPosition);

    document.getElementById("candidateName").addEventListener("input", function (event) {
      sessionState.candidateName = event.target.value;
      saveSession();
      selectNode(activeNodeId, false);
    });

    document.getElementById("staffName").addEventListener("input", function (event) {
      sessionState.staffName = event.target.value;
      saveSession();
      selectNode(activeNodeId, false);
    });

    document.getElementById("exportNotesButton").addEventListener("click", openExportDialog);
    document.getElementById("copyExportButton").addEventListener("click", copyExportText);
    document.getElementById("downloadExportButton").addEventListener("click", downloadExportText);
    document.getElementById("closeExportButton").addEventListener("click", function () {
      document.getElementById("exportDialog").close();
    });
    document.getElementById("exportDialog").addEventListener("click", function (event) {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });

    mobileMedia.addEventListener("change", function () {
      openStageForNode(activeNodeId);
      if (!mobileMedia.matches) document.body.dataset.mobileView = "flow";
    });
    hoverPreviewMedia.addEventListener("change", function () { hideCopyPreview(); });

    loadSession();
    if (sessionState.copyItemsOverride) applyCopyItems(sessionState.copyItemsOverride);
    document.getElementById("candidateName").value = sessionState.candidateName;
    document.getElementById("staffName").value = sessionState.staffName;
    const initialId = location.hash.slice(1);
    const hasInitialNode = Boolean(DATA.nodes[initialId]);
    renderFlow();
    updateMemoIndicators();
    selectNode(hasInitialNode ? initialId : "opening", false);
    setMobileView(hasInitialNode ? "detail" : "flow", false);
    loadPublishedCopyItems(false);
  </script>
</body>
</html>
